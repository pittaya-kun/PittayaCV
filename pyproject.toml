[project]
name = "auto-cv"
version = "0.1.0"
description = "Automated job search + tailored CV generator"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Pittaya", email = "pittaya@example.com"}
]
keywords = ["job-search", "cv", "resume", "automation", "ats"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core CLI & Config
    "typer[all]>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13.7",

    # Storage
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",

    # Job Scraping (custom scrapers)
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "playwright>=1.40",

    # Matching (Embeddings)
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",  # para cosine_similarity

    # CV Generation (PDF via fpdf2, sem LaTeX)
    "fpdf2>=2.7",
    "markdown2>=2.4",

    # LLM (Anthropic SDK)
    "anthropic>=0.25",

    # Utils
    "httpx>=0.27",
    "tenacity>=8.3",
    "python-dateutil>=2.9",
    "hashids>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.6",
]
full = ["dev"]

[project.scripts]
auto-cv = "auto_cv.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py39"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008"]
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/auto_cv"]
omit = ["tests/*", "*/__init__.py"]

[tool.alembic]
script_location = "src/auto_cv/storage/migrations"